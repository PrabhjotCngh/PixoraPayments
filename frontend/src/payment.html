<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Payment</title>
  <link rel="stylesheet" href="./css/kiosk.css">
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
</head>

<body class="payment-screen"
  style="background-image: url('../assets/background.png'); background-size: cover; background-position: center; background-repeat: no-repeat;">

  <div class="container">

    <div id="qr-code-wrapper" class="qr-code-wrapper loading"
      style="position: relative; min-height: 60vh; width: 100%;">
      <div class="loader" style="width: 96px; height: 96px; border-width: 12px;"></div>
      <div id="upi-qr"></div>
    </div>

  </div>

  <script>
    let qrCodeId = null;
    let tapCount = 0;
    let tapTimer = null;
    let boothPriceInr = 250.00;  // Default price

    // 5-tap gesture to open config (anywhere on screen)
    function setupTapGesture() {
      console.log('[5-tap] Gesture listener registered');
      document.addEventListener('click', (e) => {
        tapCount++;
        console.log('[5-tap] Tap count:', tapCount);
        if (tapCount === 1) {
          tapTimer = setTimeout(() => {
            console.log('[5-tap] Timer reset');
            tapCount = 0;
          }, 2000);
        }
        if (tapCount >= 5) {
          console.log('[5-tap] Opening config!');
          clearTimeout(tapTimer);
          tapCount = 0;
          openBoothConfig();
        }
      });
    }

    async function fetchBoothPrice() {
      try {
        const boothConfig = await window.electronAPI.getBoothConfig();
        if (!boothConfig || !boothConfig.serverUrl) {
          console.warn('[fetchBoothPrice] Booth not configured, using default price');
          return boothPriceInr;
        }

        // Fetch booth price from server
        const response = await fetch(`${boothConfig.serverUrl}/api/booth/info`, {
          headers: {
            'Authorization': `Bearer ${boothConfig.apiKey}`
          }
        });

        if (!response.ok) {
          console.warn('[fetchBoothPrice] Failed to fetch booth info, using default price:', response.status);
          return boothPriceInr;
        }

        const data = await response.json();
        if (data.booth && typeof data.booth.price_inr === 'number') {
          boothPriceInr = data.booth.price_inr;
          console.log('[fetchBoothPrice] Fetched booth price: ₹' + boothPriceInr.toFixed(2));
        }
        return boothPriceInr;
      } catch (e) {
        console.error('[fetchBoothPrice] Error fetching booth price:', e);
        return boothPriceInr;
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      // Setup 5-tap gesture
      setupTapGesture();

      // Check if booth is configured
      const boothConfig = await window.electronAPI.getBoothConfig();
      if (!boothConfig || !boothConfig.apiKey || !boothConfig.serverUrl) {
        // Not configured - launch config screen
        openBoothConfig();
        return;
      }

      // Fetch booth price from server
      await fetchBoothPrice();

      // Show loader while loading QR
      const wrapperEl = document.getElementById('qr-code-wrapper');
      if (wrapperEl) wrapperEl.classList.add('loading');
      await generateQRCode(boothPriceInr);
    });

    async function generateQRCode(amountInRupees) {
      console.log('[generateQRCode] Starting with amount:', amountInRupees);
      try {
        console.log('[generateQRCode] Calling createOrder...');
        const res = await window.electronAPI.createOrder(
          amountInRupees * 100,
          'Pixora Photo Session'
        );
        console.log('[generateQRCode] Received response:', res);
        const wrapperEl = document.getElementById('qr-code-wrapper');
        if (!res?.success || !res?.qrCode?.payment_session_id) {
          console.error('[generateQRCode] Invalid response - success:', res?.success, 'payment_session_id:', res?.qrCode?.payment_session_id);
          if (wrapperEl) wrapperEl.classList.remove('loading');
          throw new Error('Invalid Cashfree response');
        }
        qrCodeId = res?.qrCode?.order_id;
        if (wrapperEl) wrapperEl.classList.remove('loading');
        console.log('[generateQRCode] Initializing Cashfree with mode:', res?.qrCode?.env);
        const cashfree = Cashfree({ mode: res?.qrCode?.env });
        console.log('[generateQRCode] Calling cashfree.checkout...');
        cashfree.checkout({
          paymentSessionId: res?.qrCode?.payment_session_id,
          redirectTarget: "_self",
          paymentMethod: { upi: { flow: "qr" } }
        });
        console.log('[generateQRCode] Cashfree checkout initiated');
      } catch (e) {
        const wrapperEl = document.getElementById('qr-code-wrapper');
        if (wrapperEl) wrapperEl.classList.remove('loading');
        console.error('QR generation failed', e);

        // Check if it's a configuration error
        if (e.message && e.message.includes('not configured')) {
          alert('Booth Not Configured!\n\nPlease configure the booth before creating orders.\n\nTap the screen 5 times quickly to open configuration.');
        } else {
          // Show detailed error for debugging
          const errorMsg = e.message || 'Unknown error';
          alert(`Failed to generate QR code.\n\nError: ${errorMsg}\n\nTap 5 times to open config or check console for details.`);
          console.error('Full error details:', e);
        }
      }
    }

    function openBoothConfig() {
      console.log('[openBoothConfig] Opening config page');
      window.electronAPI.openBoothConfig();
    }

  </script>

</body>

</html>
