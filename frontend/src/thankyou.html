<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <link rel="stylesheet" href="./css/kiosk.css">
</head>

<body class="payment-screen"
    style="background-image: url('../assets/background.png'); background-size: cover; background-position: center; background-repeat: no-repeat;">
    <div class="container" style="display: flex; align-items: center; justify-content: center; min-height: 80vh;">
        <div id="loader" class="qr-code-wrapper loading" style="position: relative; min-height: 60vh; width: 100%;">
            <div class="loader" style="width: 96px; height: 96px; border-width: 12px;"></div>
        </div>
    </div>
    <script>
        function getOrderIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('order_id');
        }

        async function getOrder(orderId, retryCount = 0, maxRetries = 10) {
            try {
                console.log(`[thankyou] Checking order status (attempt ${retryCount + 1}/${maxRetries + 1}):`, orderId);
                const response = await fetch(`/api/get-order/${encodeURIComponent(orderId)}`);
                const data = await response.json();
                
                console.log('[thankyou] Order status response:', data);
                
                if (data.success && data.paid) {
                    console.log('[thankyou] Payment confirmed! Redirecting to success...');
                    window.location.replace('success.html');
                } else if (retryCount < maxRetries) {
                    // Retry after 2 seconds if payment not confirmed yet
                    console.log(`[thankyou] Payment not confirmed yet, retrying in 2s...`);
                    setTimeout(() => getOrder(orderId, retryCount + 1, maxRetries), 2000);
                } else {
                    // Max retries reached, payment not confirmed
                    console.log('[thankyou] Max retries reached, payment not confirmed. Redirecting to failure...');
                    window.location.replace('failure.html');
                }
            } catch (e) {
                console.error('[thankyou] Error checking order:', e);
                if (retryCount < maxRetries) {
                    // Retry on network error too
                    console.log(`[thankyou] Network error, retrying in 2s...`);
                    setTimeout(() => getOrder(orderId, retryCount + 1, maxRetries), 2000);
                } else {
                    window.location.replace('failure.html');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const orderId = getOrderIdFromUrl();
            if (orderId) {
                console.log('[thankyou] Page loaded with order_id:', orderId);
                getOrder(orderId);
            } else {
                console.log('[thankyou] No order_id in URL');
                window.location.replace('failure.html');
            }
        });
    </script>
</body>

</html>
